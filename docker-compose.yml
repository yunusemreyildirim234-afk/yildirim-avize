services:
      yildirim-avize:
        build: .
        ports:
          - "80:3000"
        restart: always
    ```

### 2. GitHub'a Basalım
Dosyaları kaydedince (`Ctrl + S`), bu kodları AWS sunucuna taşımanın en temiz yolu GitHub'dır. 
1.  Sol taraftaki menüde (üstten üçüncü, dalgalı çizgi simgesi) **Source Control** kısmına bas.
2.  **"Publish to GitHub"** butonuna bas.
3.  Repo ismini "yildirim-avize" yap ve "Public" olarak paylaş.

### 3. AWS Terminaline Geçiş
Kodlar GitHub'a gidince, o meşhur AWS siyah ekranını (SSH terminalini) aç ve şu komutları sırasıyla yaz:

```bash
# Kodları AWS'ye indir
git clone https://github.com/KULLANICI_ADIN/yildirim-avize.git
cd yildirim-avize

# Docker'ı çalıştır ve siteyi dünyaya aç!
sudo docker compose up -d --build